suite: test if the schedule pod kills policy is generated correctly
templates:
- templates/schedule-pod-kills.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: renders the strimzi-operator pod kill schedule when the chaos-mesh api is available
  asserts:
  - containsDocument:
      apiVersion: chaos-mesh.org/v1alpha1
      kind: Schedule
      name: schedule-strimzioperator-service-pod-kill
  - matchSnapshot: {}
  capabilities:
    apiVersions:
    - chaos-mesh.org/v1alpha1/Schedule
- it: omits the strimzi-operator pod kill schedule when the chaos-mesh api is unavailable
  asserts:
  - containsDocument:
      apiVersion: chaos-mesh.org/v1alpha1
      kind: Schedule
      name: schedule-strimzioperator-service-pod-kill
    not: true
  - matchSnapshot: {}
