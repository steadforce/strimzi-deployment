suite: strimzi-operator container resources per stage
templates:
- charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
tests:
- it: sets zero cpu and memory requests, zero cpu limit and a memory limit on the local cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: &operatorLimitsCpuPath spec.template.spec.containers[?(@.name == "strimzi-cluster-operator")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: &zeroQuantityPattern "^0.*"
  - matchRegex:
      path: &operatorLimitsMemoryPath spec.template.spec.containers[?(@.name == "strimzi-cluster-operator")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: &nonZeroQuantityPattern "^[1-9].*"
  - matchRegex:
      path: &operatorRequestsCpuPath spec.template.spec.containers[?(@.name == "strimzi-cluster-operator")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: *zeroQuantityPattern
  - matchRegex:
      path: &operatorRequestsMemoryPath spec.template.spec.containers[?(@.name == "strimzi-cluster-operator")].resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests
      pattern: *zeroQuantityPattern
  - matchSnapshot: {}

- it: sets non-zero requests and limits with an overridden memory limit on non-local clusters
  values:
  - ../values-subchart-overrides.yaml
  asserts:
  - matchRegex:
      path: *operatorLimitsCpuPath
      # on non-local cluster we expect non 0 cpu limits
      pattern: *nonZeroQuantityPattern
  - matchRegex:
      path: *operatorLimitsMemoryPath
      # on non-local cluster we expect non 0 memory limits
      pattern: *nonZeroQuantityPattern
  - notEqual:
      path: *operatorLimitsMemoryPath
      # expect that the memory limit value from the subchart has been overridden
      value: "384Mi"
  - matchRegex:
      path: *operatorRequestsCpuPath
      # on non-local cluster we expect non 0 cpu requests
      pattern: *nonZeroQuantityPattern
  - matchRegex:
      path: *operatorRequestsMemoryPath
      # on non-local cluster we expect non 0 memory requests
      pattern: *nonZeroQuantityPattern
  - matchSnapshot: {}
